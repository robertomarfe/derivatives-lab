name: Deploy Derivatives Lab v1.1

on:
  push:
    paths:
      - '.github/workflows/deploy-v11.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and unpack v1.1
        shell: bash
        run: |
          set -euo pipefail
          unzip -t .deploy/DerivativesLab_Web_v1_1.zip
          rm -rf /tmp/dlab-v11
          mkdir -p /tmp/dlab-v11
          unzip -q .deploy/DerivativesLab_Web_v1_1.zip -d /tmp/dlab-v11
          cp -a /tmp/dlab-v11/. .

      - name: Commit v1.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Deployment files already match v1.1.'
            exit 0
          fi
          git commit -m 'Deploy Derivatives Lab Web v1.1'
          git push
