name: Deploy Derivatives Lab v1.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify validated v1.1 distribution
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.deploy/v11_part_*.b64)
          if [ ${#parts[@]} -eq 0 ]; then
            echo 'No validated v1.1 deployment chunks were found.' >&2
            exit 1
          fi
          cat "${parts[@]}" > /tmp/DerivativesLab_Web_v1_1_DIST.b64
          base64 --decode /tmp/DerivativesLab_Web_v1_1_DIST.b64 > /tmp/DerivativesLab_Web_v1_1_DIST.zip
          echo 'e449fd8a4cf8597fcc2c87b4e50535617bebdcab05ed0884e825a8f3843d91bc  /tmp/DerivativesLab_Web_v1_1_DIST.zip' | sha256sum -c -
          unzip -t /tmp/DerivativesLab_Web_v1_1_DIST.zip
          rm -rf /tmp/dlab-v11
          mkdir -p /tmp/dlab-v11
          unzip -q /tmp/DerivativesLab_Web_v1_1_DIST.zip -d /tmp/dlab-v11

      - name: Install static distribution
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/dlab-v11/. .

      - name: Commit v1.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nojekyll index.html app.js content.js styles.css manifest.webmanifest service-worker.js worker.js assets core modules vendor
          if git diff --cached --quiet; then
            echo 'Deployment files already match validated v1.1.'
            exit 0
          fi
          git commit -m 'Deploy Derivatives Lab Web v1.1'
          git push
