name: Unpack static web deployment

on:
  push:
    paths:
      - '.github/workflows/unpack-deploy.yml'

permissions:
  contents: write

jobs:
  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct verified deployment archive
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part_*.b64 > /tmp/derivatives-lab-dist.b64
          base64 --decode /tmp/derivatives-lab-dist.b64 > /tmp/derivatives-lab-dist.zip
          unzip -t /tmp/derivatives-lab-dist.zip
          unzip -o /tmp/derivatives-lab-dist.zip -d .

      - name: Commit exact static distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nojekyll index.html app.js content.js styles.css manifest.webmanifest service-worker.js worker.js assets core modules
          if git diff --cached --quiet; then
            echo 'Deployment files already match the archive.'
            exit 0
          fi
          git commit -m 'Deploy Derivatives Lab Web v1.0'
          git push
